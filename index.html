<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Snake — Retro Brick Phone Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <div class="stage">

    <h1 class="title">SNAKE <span class="title-sub">retro brick-phone edition</span></h1>

    <div class="phone">
      <div class="speaker"></div>

      <div class="screen-bezel">
        <div class="lcd">
          <canvas id="game-canvas" width="336" height="192"></canvas>
          <div class="lcd-glare"></div>
        </div>
      </div>

      <div class="phone-brand">SNAKE II</div>

      <div class="controls">
        <div class="dpad">
          <button class="dpad-btn up" data-dir="up" aria-label="Up">▲</button>
          <button class="dpad-btn left" data-dir="left" aria-label="Left">◀</button>
          <button class="dpad-btn center" data-action="pause" aria-label="Pause">●</button>
          <button class="dpad-btn right" data-dir="right" aria-label="Right">▶</button>
          <button class="dpad-btn down" data-dir="down" aria-label="Down">▼</button>
        </div>
        <div class="soft-keys">
          <button class="soft-key" id="btn-start">Start</button>
          <button class="soft-key" id="btn-sound">Sound: On</button>
        </div>
      </div>
    </div>

    <p class="hint">Arrow keys / WASD to move · Space to pause · Tap the ● button on touch devices</p>

  </div>

  <script src="/game.js"></script>
</body>
</html>
